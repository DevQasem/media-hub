version: '3.8'

services:
  media-hub:
    build: .
    container_name: media-hub
    ports:
      - "5000:5000"
    volumes:
      # App data (jobs, settings, watchlist, tags, thumbnails) stays in ./hub-data
      - ./hub-data:/root/media-downloader
      # The downloaded media itself: set MEDIA_DIR in .env (e.g. /mnt/data/media), defaults to ./hub-data/downloads
      - ${MEDIA_DIR:-./hub-data/downloads}:/root/media-downloader/downloads
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_IDS: ${ALLOWED_IDS}
      HUB_URL: "http://127.0.0.1:5000"
      HUB_TOKEN: ${HUB_TOKEN:-}
      HUB_FILES_PIN: ${HUB_FILES_PIN}
    restart: unless-stopped